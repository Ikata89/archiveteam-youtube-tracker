name: Track YouTube Stats
# Polls tracker.archiveteam.org/youtube/ every 5 minutes and commits the CSV.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-stats
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/London

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch stats
        run: python tracker_stats.py --once

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube_tracker_stats.csv
          git diff --cached --quiet || git commit -m "stats: $(date '+%d/%m/%Y %H:%M:%S')"
          git push
